name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances npm
        run: npm ci

      # Retour rapide en cas d'échec, avant de lancer le build Docker (qui
      # relance de toute façon les mêmes tests via le script "prebuild" —
      # voir package.json — donc aucun risque de publier une image dont les
      # tests ne passent pas, même si cette étape était retirée).
      - name: Lancer les tests
        run: npm test

      - name: Lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # "pattern=v{{version}}" (et non {{version}}) : docker/metadata-action
          # retire par défaut le préfixe "v" du tag git pour former le tag Docker
          # (ex: tag git "v0.4.0" -> image "0.4.0" sans le "v") — source de
          # confusion en déploiement (Portainer échoue en "manifest unknown" si
          # on tape le nom du tag git tel quel). On le réinjecte explicitement
          # pour que le tag Docker corresponde exactement au tag git.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/amd64 — NAS Synology DS218+ / Intel)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
