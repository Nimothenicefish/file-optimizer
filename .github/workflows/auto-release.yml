name: Auto-tag une version (patch/minor/major)

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determiner le dernier tag de version
        id: last
        run: |
          LAST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          echo "base=${LAST_TAG:-v0.0.0}" >> "$GITHUB_OUTPUT"
          echo "range=${LAST_TAG:+$LAST_TAG..}HEAD" >> "$GITHUB_OUTPUT"

      - name: Analyser les commits depuis ce tag
        id: bump
        run: |
          SUBJECTS=$(git log ${{ steps.last.outputs.range }} --pretty=format:%s)
          echo "Commits analyses :"
          echo "$SUBJECTS"
          if echo "$SUBJECTS" | grep -qiE '^major:'; then
            echo "level=major" >> "$GITHUB_OUTPUT"
          elif echo "$SUBJECTS" | grep -qiE '^minor:'; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          elif echo "$SUBJECTS" | grep -qiE '^patch:'; then
            echo "level=patch" >> "$GITHUB_OUTPUT"
          else
            echo "level=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculer et pousser le nouveau tag
        if: steps.bump.outputs.level != 'none'
        id: tag
        run: |
          VERSION="${{ steps.last.outputs.base }}"
          VERSION="${VERSION#v}"
          MAJOR=$(cut -d. -f1 <<< "$VERSION")
          MINOR=$(cut -d. -f2 <<< "$VERSION")
          PATCH=$(cut -d. -f3 <<< "$VERSION")
          case "${{ steps.bump.outputs.level }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      # Un tag pousse avec le token du workflow ne redeclenche pas
      # automatiquement le workflow de build (protection anti-boucle de
      # GitHub sur les push faits par GITHUB_TOKEN) -- on le declenche donc
      # explicitement. workflow_dispatch est exempte de cette restriction.
      - name: Declencher le build/publish de l'image pour ce tag
        if: steps.bump.outputs.level != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker-publish.yml --ref "${{ steps.tag.outputs.new_tag }}"

      - name: Creer la GitHub Release
        if: steps.bump.outputs.level != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.new_tag }}" \
            --title "${{ steps.tag.outputs.new_tag }}" \
            --generate-notes
